<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aether student resilience research map</title>
  <desc id="desc">A refined research map showing evidence, belonging, privacy, human support, and student resilience connected through a calm academic workflow.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfcf8"/>
      <stop offset="0.58" stop-color="#eef6f2"/>
      <stop offset="1" stop-color="#f7efe5"/>
    </linearGradient>
    <linearGradient id="ink" x1="180" y1="120" x2="1420" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18355f"/>
      <stop offset="1" stop-color="#0d5f57"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efb74e"/>
      <stop offset="1" stop-color="#d86d4b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#12324d" flood-opacity="0.14"/>
    </filter>
