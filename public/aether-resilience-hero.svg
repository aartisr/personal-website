  <text x="1032" y="288" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="15" fill="#6a5b45">privacy</text>
  <text x="1188" y="288" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="15" fill="#6a5b45">human care</text>

