  <text x="744" y="255" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#5d3a16">Evidence to Practice</text>
  <path d="M752 314H1328" stroke="#d7ba7a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="782" cy="314" r="11" fill="#18355f"/>
  <circle cx="936" cy="314" r="11" fill="#0d5f57"/>
  <circle cx="1090" cy="314" r="11" fill="#d86d4b"/>
