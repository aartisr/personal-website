    <text x="1138" y="582" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#18355f">Human handoff</text>
  </g>

  <path d="M476 523H516" stroke="#9fbfb6" stroke-width="4" stroke-linecap="round"/>
  <path d="M768 523H808" stroke="#9fbfb6" stroke-width="4" stroke-linecap="round"/>
  <path d="M1060 523H1100" stroke="#9fbfb6" stroke-width="4" stroke-linecap="round"/>

  <text x="224" y="696" font-family="Iowan Old Style, Palatino Linotype, Georgia, serif" font-size="36" font-weight="700" fill="url(#ink)">Evidence-led kindness for student resilience</text>
  <text x="224" y="730" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="18" fill="#456171">Academic rigor, plain-language clarity, privacy-aware AI, and care that stays human.</text>
