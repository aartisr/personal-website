  <text x="260" y="298" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="18" fill="#35556f">How can student support become earlier,</text>
  <text x="260" y="328" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="18" fill="#35556f">kinder, safer, and easier to trust?</text>

