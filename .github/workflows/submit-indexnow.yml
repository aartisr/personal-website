name: Submit production URLs to IndexNow

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Canonical production URL
        required: true
        default: https://ai-aarti.com

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Submit sitemap URLs
        env:
          SITE_URL: ${{ inputs.site_url }}
          INDEXNOW_KEY: 2f04bb3a2771437db8aba059ae4b2045
        run: |
          key=$(tr -d '\r\n' < 2f04bb3a2771437db8aba059ae4b2045.txt)
          test "$key" = "$INDEXNOW_KEY"
          curl --fail-with-body --silent --show-error \
            --request POST https://api.indexnow.org/indexnow \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "$(curl --fail --silent "$SITE_URL/sitemap.xml" | node -e '
              const chunks = [];
              process.stdin.on("data", chunk => chunks.push(chunk));
              process.stdin.on("end", () => {
                const xml = Buffer.concat(chunks).toString();
                const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(match => match[1]);
                const site = new URL(process.env.SITE_URL);
                console.log(JSON.stringify({ host: site.host, key: process.env.INDEXNOW_KEY, keyLocation: `${site.origin}/${process.env.INDEXNOW_KEY}.txt`, urlList: urls }));
              });
            ')"
